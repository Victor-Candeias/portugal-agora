name: Android (mobile)

# Build do apps/mobile (Expo) via `expo prebuild` + Gradle — sem EAS/conta Expo (MOB-007).
# Gera AAB (Google Play) e APK (instalação direta) e, opcionalmente, publica no Google Play.
#
# Secrets (Settings → Secrets and variables → Actions):
#   APIABERTA_KEY               chave da API Aberta embutida no bundle (EXPO_PUBLIC_APIABERTA_KEY)
#   OPEN_CHARGE_MAP_KEY         chave do Open Charge Map (postos EV), embutida via app.config.js (extra.openChargeMapKey)
#   ANDROID_KEYSTORE_BASE64     upload keystore (.jks) em base64; sem ela o release é assinado com a debug keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   JSON da service account com acesso à app na Play Console (só para publicar)

on:
  workflow_dispatch:
    inputs:
      track:
        description: Faixa do Google Play onde publicar (none = só build)
        type: choice
        options: [none, internal, alpha, beta]
        default: none
      status:
        description: Estado do release no Play (draft enquanto a app não tiver sido publicada uma vez)
        type: choice
        options: [draft, completed]
        default: draft
  push:
    tags: ['mobile-v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      EXPO_PUBLIC_APIABERTA_KEY: ${{ secrets.APIABERTA_KEY }}
      OPEN_CHARGE_MAP_KEY: ${{ secrets.OPEN_CHARGE_MAP_KEY }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      PLAY_TRACK: ${{ inputs.track || 'none' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Validar pré-requisitos de publicação
        if: env.PLAY_TRACK != 'none'
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Publicar no Google Play requer o secret ANDROID_KEYSTORE_BASE64 (upload key)."; exit 1
          fi
          if [ "$HAS_PLAY_ACCOUNT" != "true" ]; then
            echo "::error::Publicar no Google Play requer o secret PLAY_SERVICE_ACCOUNT_JSON."; exit 1
          fi

      - name: Upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Aviso de assinatura
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Sem ANDROID_KEYSTORE_BASE64 — o release fica assinado com a debug keystore (não publicável)."

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build AAB + APK (release)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload artefactos
        uses: actions/upload-artifact@v6
        with:
          name: portugal-hoje-android-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publicar no Google Play
        if: env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pt.portugalhoje.app
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ inputs.status }}
