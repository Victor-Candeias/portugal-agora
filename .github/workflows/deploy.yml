name: Deploy Pages V2

on:
  workflow_dispatch:
  # Deploy diário (WEB-054): reconstrói os dados estáticos, incluindo a energia REN do dia anterior
  # (publicado pela REN até ~12:30 de Lisboa). O cron do GitHub não garante hora exata.
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez (o agendado e o manual não se sobrepõem).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Necessário para ler o secret VITE_APIABERTA_KEY do ambiente github-pages.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Node ≥ 22.18 (type stripping) para o build-energy-db.mjs importar o core em TypeScript.
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static data (Carris, Metro do Porto, Serviços Públicos, Energia)
        # A energia (scripts/build-energy-db.mjs) usa type stripping do Node ≥ 22.18; se a REN falhar
        # republica o último dataset publicado e nunca falha este passo.
        run: pnpm --filter web build:db

      - name: Build
        run: pnpm --filter web build
        env:
          # Fica embutida no bundle público do Pages.
          VITE_APIABERTA_KEY: ${{ secrets.VITE_APIABERTA_KEY }}
          # Postos de carregamento EV (WEB-040); secret do repositório, embutido no bundle.
          OPEN_CHARGE_MAP_KEY: ${{ secrets.OPEN_CHARGE_MAP_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5