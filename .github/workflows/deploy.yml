name: Deploy Pages V2

on:
  workflow_dispatch:
  # Deploy diário (WEB-054): reconstrói os dados estáticos, incluindo a energia REN do dia anterior
  # (publicado pela REN até ~12:30 de Lisboa). O cron do GitHub não garante hora exata.
  # Horário (WEB-057): atualiza o intradiário ENTSO-E (a hora H sai ~65 min depois do fim) e
  # reutiliza os .sqlite já publicados das outras secções.
  schedule:
    - cron: '0 13 * * *'
    - cron: '20 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez (o agendado e o manual não se sobrepõem).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Necessário para ler o secret VITE_APIABERTA_KEY do ambiente github-pages.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Node ≥ 22.18 (type stripping) para o build-energy-db.mjs importar o core em TypeScript.
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static data (Carris, Metro do Porto, Serviços Públicos, Energia)
        # A energia (scripts/build-energy-db.mjs) usa type stripping do Node ≥ 22.18; se a REN ou a
        # ENTSO-E falharem republica o último dataset publicado e nunca falha este passo. O estado de
        # cada fonte e a reconciliação REN × ENTSO-E vão para energy/status.json, para avisos
        # (::warning) e para o resumo do job (WEB-060).
        # Na execução horária reutiliza os .sqlite publicados (Carris, Metro, Serviços Públicos) e
        # só refaz a energia; se o download falhar, reconstrói tudo.
        env:
          # Token da ENTSO-E Transparency Platform (WEB-057); só usado no build, nunca no bundle.
          TRANSPARENCT_ENTSOE_TOKEN: ${{ secrets.TRANSPARENCT_ENTSOE_TOKEN }}
          HOURLY: ${{ github.event.schedule == '20 * * * *' }}
        run: |
          reuse=false
          if [ "$HOURLY" = "true" ]; then
            reuse=true
            mkdir -p apps/web/public/data
            for f in carris.sqlite metro-porto.sqlite public-services.sqlite; do
              if ! curl -fsSL --retry 3 -o "apps/web/public/data/$f" "https://victor-candeias.github.io/portugal-agora/data/$f" \
                || [ "$(head -c 15 "apps/web/public/data/$f")" != "SQLite format 3" ]; then
                echo "::warning::$f publicado indisponível; a reconstruir todos os dados."
                reuse=false
                break
              fi
            done
          fi
          if [ "$reuse" = "true" ]; then
            pnpm --filter web build:energy
          else
            pnpm --filter web build:db
          fi

      - name: Build
        run: pnpm --filter web build
        env:
          # Fica embutida no bundle público do Pages.
          VITE_APIABERTA_KEY: ${{ secrets.VITE_APIABERTA_KEY }}
          # Postos de carregamento EV (WEB-040); secret do repositório, embutido no bundle.
          OPEN_CHARGE_MAP_KEY: ${{ secrets.OPEN_CHARGE_MAP_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5